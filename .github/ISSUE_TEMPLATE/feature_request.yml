name: ✨ Feature request
description: Suggest an idea for GitPulse
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution
      description: Mock the Telegram message or panel if it helps.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
